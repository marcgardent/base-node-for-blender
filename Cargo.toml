# The crates of Base Node for Blender: its library (rust/) and the web component (web/). The core of
# the language is their one dependency outside them, named here alone: its path, the git submodule
# core/ (CORE of the Makefile), and the version this repository needs.
[workspace]
members = ["rust", "web"]
resolver = "2"

[workspace.dependencies]
base-node = { path = "core/rust", version = "=1.0.0" }

[profile.release]
opt-level = "s"
lto = true
