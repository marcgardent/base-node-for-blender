# The site of Base Node for Blender, https://blender.basenode.ludopant.com/ (site/CNAME): site/, with
# bn-view built and the reference pages written, the language's from the core's spec (core/).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs: the deploy looks for the artifact only once the job that uploaded it is over (in the
# same job the run's list of artifacts can still be empty), and it can be re-run alone, without
# uploading a second artifact of the same name.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (the version web/Cargo.toml pins)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build bn-view (site/view/pkg)
        run: ./web/build.sh
      - name: Write the reference pages (site/reference, the language's from core/spec/)
        run: make docs
      - name: Prepare site
        run: touch site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
